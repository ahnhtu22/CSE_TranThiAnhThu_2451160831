<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm - Responsive Layout</title>
    <link rel="stylesheet" href="scss/responsive.css">
</head>
<body>
    <header class="header">
        <div class="logo">MyBrand</div>
        <button class="hamburger">☰</button>
        <nav class="nav-menu">
            <ul>
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Sản phẩm</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
        </nav>
    </header>

    <div class="main-layout">
        <aside class="sidebar">
            <h3>Bộ lọc</h3>
            <ul>
                <li>Danh mục 1</li>
                <li>Danh mục 2</li>
            </ul>
        </aside>

        <main class="product-grid">
            <div class="card">
                <img src="adidas.jpg" alt="Dép Adidas" class="card-image">
                <h3 class="card-title">Sản phẩm 1</h3>
                <p>150.000đ</p>
                <button class="btn">Mua ngay</button>
            </div>
            </main>

        <aside class="ads-bar">
            <h3>Quảng cáo</h3>
        </aside>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Bản quyền thuộc về MyBrand</p>
    </footer>
</body>
</html>
