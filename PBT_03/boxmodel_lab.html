<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Model Lab</title>
    <link rel="stylesheet" href="boxmodel.css">
</head>
<body>
    <h2>Phần 1: Content-box vs Border-box</h2>
    <div class="box-container">
        <div class="box box-content">Box 1 (content-box)</div>
        <div class="box box-border">Box 2 (border-box)</div>
    </div>

    <h2>Phần 2: Layout 3 cột (Sử dụng border-box)</h2>
    <div class="layout-container">
        <div class="col sidebar">Sidebar</div>
        <div class="col content">Content</div>
        <div class="col ads">Ads</div>
    </div>
</body>
</html>
