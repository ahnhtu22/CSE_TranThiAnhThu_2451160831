<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test Validation Câu A2</title>
    <style>
        fieldset { margin-bottom: 20px; background-color: #f9f9f9; }
        legend { font-weight: bold; color: blue; }
    </style>
</head>
<body>
    <h2>Kiểm tra Validation (Câu A2)</h2>

    <form action="#">
        <fieldset>
            <legend>Trường hợp 1: required</legend>
            <input type="text" required value="">
            <button type="submit">Gửi</button>
        </fieldset>
    </form>

    <form action="#">
        <fieldset>
            <legend>Trường hợp 2: type="email"</legend>
            <input type="email" value="abc">
            <button type="submit">Gửi</button>
        </fieldset>
    </form>

    <form action="#">
        <fieldset>
            <legend>Trường hợp 3: min/max</legend>
            <input type="number" min="1" max="10" value="15">
            <button type="submit">Gửi</button>
        </fieldset>
    </form>

    <form action="#">
        <fieldset>
            <legend>Trường hợp 4: pattern</legend>
            <input type="text" pattern="[0-9]{10}" value="abc123">
            <button type="submit">Gửi</button>
        </fieldset>
    </form>

    <form action="#">
        <fieldset>
            <legend>Trường hợp 5: minlength</legend>
            <input type="password" minlength="8" value="123">
            <button type="submit">Gửi</button>
        </fieldset>
    </form>

</body>
</html>
