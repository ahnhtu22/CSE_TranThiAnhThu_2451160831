<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giới thiệu iPhone 16</title>
</head>
<body>
    <h1>Trải nghiệm Đa phương tiện: iPhone 16</h1>

    <h2>Logo SVG (Icon Smartphone)</h2>
    <svg width="100" height="100">
        <rect x="25" y="10" width="50" height="80" rx="10" ry="10" stroke="black" stroke-width="3" fill="#f4f4f4" />
        <circle cx="40" cy="25" r="6" fill="#333" />
        <circle cx="40" cy="40" r="6" fill="#333" />
    </svg>

    <h2>Hình ảnh sản phẩm</h2>
    <figure>
        <img src="front16.png" alt="Mặt trước iPhone 16" loading="lazy" style="max-width: 100%; height: auto;">
        <figcaption>Hình 1: Mặt trước với Dynamic Island hiện đại</figcaption>
    </figure>
    <figure>
        <img src="back16.png" alt="Mặt sau iPhone 16" loading="lazy" style="max-width: 100%; height: auto;">
        <figcaption>Hình 2: Cụm camera đặt dọc chuẩn studio</figcaption>
    </figure>
    <figure>
        <img src="colors16.png" alt="Các phiên bản màu sắc iPhone 16" loading="lazy" style="max-width: 100%; height: auto;">
        <figcaption>Hình 3: Các phiên bản màu sắc mới cực kỳ bắt mắt</figcaption>
    </figure>

    <h2>Video Trải nghiệm (YouTube)</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/f36QRp24F5c" title="Video Review iPhone 16" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

    <h2>Video Hướng dẫn tính năng Camera Control</h2>
    <video controls poster="img/poster-iphone.jpg" width="500">
        <source src="video/camera-control.mp4" type="video/mp4">
        <source src="video/camera-control.webm" type="video/webm">
        Trình duyệt của bạn không hỗ trợ thẻ video.
    </video>

    <h2>Nhạc chuông mặc định</h2>
    <audio controls>
        <source src="https://zingmp3.vn/bai-hat/iPhone-6-Nhac-Chuong-iphone7-plus/IWB7DFWE.html" type="audio/mpeg">
        Trình duyệt của bạn không hỗ trợ thẻ audio.
    </audio>
</body>
</html>
