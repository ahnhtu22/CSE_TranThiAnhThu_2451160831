<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Công việc Cá nhân</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Quản lý Công việc</h1>

        <div class="thong-ke">
            <div class="o-thong-ke">
                <p>Tổng số</p>
                <h3 id="tongSo">0</h3>
            </div>
            <div class="o-thong-ke">
                <p>Đã xong</p>
                <h3 id="daXong" style="color: #28a745;">0</h3>
            </div>
            <div class="o-thong-ke">
                <p>Chưa xong</p>
                <h3 id="chuaXong" style="color: #ff9800;">0</h3>
            </div>
        </div>

        <div id="thongBao" class="thong-bao"></div>

        <div class="thanh-cong-cu">
            <button id="btnMoForm" class="btn-do">Thêm Công Việc Mới</button>
        </div>

        <div id="danhSachCongViec">
            </div>
    </div>

    <div id="khungModal" class="modal">
        <div class="modal-noi-dung">
            <button id="btnDongX" class="btn-x">&times;</button>
            
            <h2 id="tieuDeForm">Thêm Công Việc</h2>
            
            <form id="formCongViec">
                <div class="nhom-nhap">
                    <label>Tiêu đề</label>
                    <input type="text" id="tieuDe" required placeholder="Nhập tên công việc...">
                </div>

                <div class="nhom-nhap">
                    <label>Mô tả ngắn</label>
                    <textarea id="moTa" rows="3" placeholder="Ghi chú thêm..."></textarea>
                </div>

                <div class="nhom-nhap">
                    <label>Hạn hoàn thành</label>
                    <input type="date" id="hanChot" required>
                </div>

                <div class="nhom-nhap">
                    <label>Mức ưu tiên</label>
                    <select id="uuTien">
                        <option value="Thấp">Thấp</option>
                        <option value="Trung bình" selected>Trung bình</option>
                        <option value="Cao">Cao</option>
                    </select>
                </div>

                <div class="modal-chan">
                    <button type="button" id="btnHuy" class="btn-xam">Hủy bỏ</button>
                    <button type="submit" class="btn-do">Lưu công việc</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
