<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh viên - K66</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Hệ thống Quản lý Sinh viên</h1>

        <div class="statistics-card">
            <div class="stat-box">
                <h3>Tổng số sinh viên</h3>
                <p id="totalStudents">0</p>
            </div>
            <div class="stat-box">
                <h3>Điểm trung bình cả lớp</h3>
                <p id="classAverage">0.0</p>
            </div>
        </div>

        <div id="alertMessage" class="alert-success"></div>

        <div class="action-bar">
            <button class="btn-add" id="btnOpenModal">
                <span>+</span> Thêm sinh viên mới
            </button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Mã SV</th>
                        <th>Họ và tên</th>
                        <th>Ngày sinh</th>
                        <th>Lớp</th>
                        <th>Điểm TB</th>
                        <th>Email</th>
                        <th style="width: 160px;">Hành động</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="studentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Thêm Sinh Viên Mới</h2>
                <button class="btn-close-x" id="btnCloseX">&times;</button>
            </div>
            
            <form id="studentForm">
                <input type="hidden" id="editStudentId">

                <div class="form-group">
                    <label for="studentId">Mã sinh viên</label>
                    <input type="text" id="studentId" class="form-control" required placeholder="VD: SV001">
                </div>

                <div class="form-group">
                    <label for="fullName">Họ và tên</label>
                    <input type="text" id="fullName" class="form-control" required placeholder="VD: Nguyễn Văn A">
                </div>

                <div class="form-group">
                    <label for="dob">Ngày sinh</label>
                    <input type="date" id="dob" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="className">Lớp học</label>
                    <input type="text" id="className" class="form-control" required placeholder="VD: K66-CSE">
                </div>

                <div class="form-group">
                    <label for="gpa">Điểm trung bình</label>
                    <input type="number" id="gpa" class="form-control" step="0.1" min="0" max="10" required placeholder="Từ 0.0 đến 10.0">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="VD: user@domain.com">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="btnCancel">Hủy bỏ</button>
                    <button type="submit" class="btn-submit" id="btnSubmitForm">Lưu dữ liệu</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
